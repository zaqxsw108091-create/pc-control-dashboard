name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 자동 시험
        run: npm test
      - name: 실제 조회 (글자로 한 번, 읽기만 함)
        run: node student/check-once.mjs
      - name: 실제 조회 JSON
        run: node student/check-once.mjs --json
